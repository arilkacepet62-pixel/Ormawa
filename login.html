<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - STIKes KHAS KEMPEK</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #000000; 
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden; /* Mencegah scroll saat loading */
        }

        /* ================= PRELOADER ================= */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .loader-content {
            text-align: center;
        }

        .loader-logo-animation {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
        }

        .loader-logo-animation img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            position: relative;
            z-index: 2;
            animation: bounceLogo 2s infinite ease-in-out;
        }

        .pulse-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            border: 3px solid #00b4d8; /* Disesuaikan dengan warna tema */
            border-radius: 50%;
            animation: ripple 2s infinite;
            z-index: 1;
        }

        .loader-text {
            color: #00b4d8;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 5px;
            margin-top: 10px;
        }

        .letter {
            display: inline-block;
            animation: waveText 1.5s infinite;
        }

        .letter:nth-child(2) { animation-delay: 0.1s; }
        .letter:nth-child(3) { animation-delay: 0.2s; }
        .letter:nth-child(4) { animation-delay: 0.3s; }
        .letter:nth-child(5) { animation-delay: 0.4s; }
        .letter:nth-child(6) { animation-delay: 0.5s; }
        .letter:nth-child(8) { animation-delay: 0.6s; }
        .letter:nth-child(9) { animation-delay: 0.7s; }
        .letter:nth-child(10) { animation-delay: 0.8s; }
        .letter:nth-child(11) { animation-delay: 0.9s; }

        @keyframes ripple {
            0% { width: 100px; height: 100px; opacity: 1; }
            100% { width: 200px; height: 200px; opacity: 0; }
        }

        @keyframes bounceLogo {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes waveText {
            0%, 100% { transform: translateY(0); opacity: 0.5; }
            50% { transform: translateY(-5px); opacity: 1; }
        }

        .loader-fade-out {
            opacity: 0;
            visibility: hidden;
        }

        /* ================= KONTEN UTAMA ================= */
        .main-wrapper {
            width: 100%;
            max-width: 1050px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 60px;
            opacity: 0; /* Disembunyikan dulu sampai loading selesai */
            transition: opacity 1s ease-in;
        }

        .show-content {
            opacity: 1 !important;
        }

        /* Form Section */
        .form-section {
            flex: 1;
            max-width: 440px;
        }

        .welcome-title {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 4px;
            color: #ffffff;
        }

        .welcome-subtitle {
            color: #9ca3af;
            font-size: 1.05rem;
            margin-bottom: 35px;
            font-weight: 400;
        }

        .input-box {
            position: relative;
            display: flex;
            align-items: center;
            border-bottom: 1.5px solid rgba(255, 255, 255, 0.7);
            margin-bottom: 24px;
            padding-bottom: 8px;
            transition: all 0.3s ease;
        }

        .input-box:focus-within {
            border-bottom-color: #007aff; 
        }

        .input-box i {
            color: #ffffff;
            font-size: 1.15rem;
            width: 28px;
            opacity: 0.9;
        }

        .input-box input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 1rem;
            padding-left: 8px;
        }

        .input-box input::placeholder {
            color: #9ca3af;
            font-size: 0.95rem;
        }

        /* Checkbox */
        .remember-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
            cursor: pointer;
            user-select: none;
        }

        .remember-wrap input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border: 1.5px solid rgba(255, 255, 255, 0.6);
            border-radius: 4px;
            background: transparent;
            cursor: pointer;
            position: relative;
            transition: all 0.2s ease;
        }

        .remember-wrap input[type="checkbox"]:checked {
            background-color: #007aff;
            border-color: #007aff;
        }

        .remember-wrap input[type="checkbox"]:checked::after {
            content: '\f00c';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            font-size: 10px;
            color: #fff;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .remember-wrap label {
            color: #cbd5e1;
            font-size: 0.9rem;
            cursor: pointer;
        }

        /* Tombol Login */
        .btn-login {
            width: 100%;
            padding: 13px 0;
            background-color: #007aff; 
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 1px;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            margin-bottom: 30px;
        }

        .btn-login:hover {
            background-color: #0066cc;
            transform: translateY(-2px);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        /* Links Bawah */
        .auth-links {
            display: flex;
            align-items: center;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .links-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .links-col.left {
            padding-right: 15px;
        }

        .links-col.right {
            padding-left: 18px;
            border-left: 1.5px solid rgba(255, 255, 255, 0.3);
        }

        .auth-links a {
            color: #d1d5db;
            text-decoration: none;
            transition: color 0.2s ease;
            text-transform: uppercase;
        }

        .auth-links a:hover {
            color: #00b4d8;
        }

        #errorMsg {
            margin-top: 15px;
            font-size: 0.88rem;
            text-align: center;
            min-height: 20px;
            font-weight: 500;
        }

        /* Logo & Identitas */
        .branding-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .logo-wrapper {
            position: relative;
            width: 250px;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
        }

        /* Animasi Logo Melayang (Floating) */
        .logo-img {
            position: relative;
            width: 220px;
            height: 220px;
            object-fit: contain;
            z-index: 2;
            animation: floatingLogo 4s ease-in-out infinite; 
            transition: transform 0.4s ease;
        }

        .logo-img:hover {
            transform: scale(1.05);
        }

        .institution-text {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .yayasan-title {
            font-size: 0.88rem;
            color: #00b4d8; 
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .stikes-title {
            font-size: 1.85rem;
            font-weight: 800;
            color: #00b4d8;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            line-height: 1.2;
        }

        .prodi-title {
            font-size: 0.92rem;
            color: #00b4d8;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        @keyframes floatingLogo {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0px); }
        }

        /* Responsive */
        @media (max-width: 868px) {
            .main-wrapper {
                flex-direction: column-reverse;
                gap: 45px;
                padding: 30px 10px;
            }
            .form-section, .branding-section {
                width: 100%;
                max-width: 380px;
            }
            .welcome-title { font-size: 2.3rem; }
            .logo-wrapper { width: 180px; height: 180px; }
            .logo-img { width: 160px; height: 160px; }
            .stikes-title { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <!-- PRELOADER -->
    <div id="preloader">
        <div class="loader-content">
            <div class="loader-logo-animation">
                <img src="img/download logo stikes.png" alt="Logo STIKes KHAS" />
                <div class="pulse-ring"></div>
            </div>
            <div class="loader-text">
                <span class="letter">O</span>
                <span class="letter">R</span>
                <span class="letter">M</span>
                <span class="letter">A</span>
                <span class="letter">W</span>
                <span class="letter">A</span>
                <span class="letter">&nbsp;</span>
                <span class="letter">S</span>
                <span class="letter">T</span>
                <span class="letter">I</span>
                <span class="letter">K</span>
                <span class="letter">e</span>
                <span class="letter">s</span>
                <span class="letter">&nbsp;</span>
                <span class="letter">K</span>
                <span class="letter">H</span>
                <span class="letter">A</span>
                <span class="letter">S</span>
            </div>
        </div>
    </div>

    <!-- KONTEN UTAMA -->
    <div class="main-wrapper" id="mainContent">
        
        <!-- Form Login -->
        <div class="form-section">
            <h1 class="welcome-title">Welcome!</h1>
            <p class="welcome-subtitle">ORMAWA STIKes KHAS Membangun Organisasi Yang Tertib Administrasi Dan Berintegritas" </p>

            <form id="loginForm">
                <div class="input-box">
                    <i class="fa-solid fa-user"></i>
                    <input type="email" id="email" placeholder="Username / Email" required autocomplete="username">
                </div>

                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
                </div>

                <div class="remember-wrap">
                    <input type="checkbox" id="rememberMe">
                    <label for="rememberMe">Remember my Username</label>
                </div>

                <button type="submit" class="btn-login" id="submitBtn">LOGIN</button>
            </form>

            <div class="auth-links">
                <div class="links-col left">
                    <a href="index.html">BERANDA</a>
                    <a href="tentangkami.html">TENTANG KAMI</a>
                </div>
                <div class="links-col right">
                    <a href="berita.html">BERITA</a>
                    <a href="kotak-aspirasi.html">KOTAK ASPIRASI</a>
                </div>
            </div>

            <div id="errorMsg"></div>
        </div>

        <!-- Logo & Info Kampus -->
        <div class="branding-section">
            <div class="logo-wrapper">
                <img src="img/download logo stikes.png" alt="Logo STIKes KHAS Kempek" class="logo-img">
            </div>

            <div class="institution-text">
                <span class="yayasan-title">YAYASAN KYAI HAJI AQIEL SIROJ</span>
                <span class="stikes-title">STIKes KHAS KEMPEK</span>
                <span class="prodi-title">PROGRAM STUDI S1 FARMASI & GIZI</span>
            </div>
        </div>

    </div>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Logika Preloader
        window.addEventListener("load", function () {
            const preloader = document.getElementById("preloader");
            const mainContent = document.getElementById("mainContent");
            const body = document.querySelector("body");
            
            if (preloader) {
                setTimeout(function () {
                    preloader.classList.add("loader-fade-out");
                    mainContent.classList.add("show-content");
                    body.style.overflow = "auto"; // Kembalikan scroll
                }, 1200); // Tampil selama 1.2 detik
            }
        });

        // Logika Login Supabase
        const { createClient } = supabase;
        const supabaseClient = createClient(
            'https://acigxznxktbdptezfbuk.supabase.co', 
            'sb_publishable_GaLfQyvfjzJCgVLBAzWerA_7_OgU6ZS'
        );

        const formLogin = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const errorMsg = document.getElementById('errorMsg');

        formLogin.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            errorMsg.style.color = "#00b4d8";
            errorMsg.innerText = "Sedang memproses autentikasi...";
            submitBtn.disabled = true;
            submitBtn.style.opacity = "0.7";

            try {
                await supabaseClient.auth.signOut();

                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) {
                    errorMsg.style.color = "#ff4d4f";
                    errorMsg.innerText = "Gagal Login: " + error.message;
                    submitBtn.disabled = false;
                    submitBtn.style.opacity = "1";
                } else {
                    errorMsg.style.color = "#52c41a";
                    errorMsg.innerText = "Login Berhasil! Mengalihkan...";
                    setTimeout(() => {
                        window.location.href = 'pembuatan-berita.html';
                    }, 500);
                }
            } catch (err) {
                errorMsg.style.color = "#ff4d4f";
                errorMsg.innerText = "Error Sistem: " + err.message;
                submitBtn.disabled = false;
                submitBtn.style.opacity = "1";
            }
        });
    </script>
</body>
</html>
